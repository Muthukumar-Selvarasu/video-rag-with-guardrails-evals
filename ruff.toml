# Ruff configuration for Video RAG with Guardrails
line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "E402",  # Module level import not at top of file
    "F401",  # Unused imports in __init__ / re-exports
]

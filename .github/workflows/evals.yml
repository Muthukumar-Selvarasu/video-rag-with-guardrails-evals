name: Video RAG Automated Evaluation Gates & CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evals-and-lint:
    name: Lint, Test Suite & Eval Threshold Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          ruff check src tests api

      - name: Run Unit & Integration Test Suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pytest tests/ -v

      - name: Run Automated Eval Benchmark Gates (--strict)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m tests.evals.report --strict

      - name: Publish Evaluation Summary to Job Summary
        if: always()
        run: |
          if [ -f reports/eval_report.md ]; then
            cat reports/eval_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-rag-eval-reports
          path: |
            reports/eval_report.md
            reports/eval_summary.json
          retention-days: 14
